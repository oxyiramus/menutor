services:
  edge:
    image: nginx:alpine
    network_mode: host
    volumes:
      - ${PROXY_TEST_CERT_DIR:?run tests/proxy/run.sh}/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PROXY_TEST_CERT_DIR:?run tests/proxy/run.sh}/proxy-key.conf:/etc/nginx/menutor/proxy-key.conf:ro
      - ${PROXY_TEST_CERT_DIR:?run tests/proxy/run.sh}/cert.pem:/certs/cert.pem:ro
      - ${PROXY_TEST_CERT_DIR:?run tests/proxy/run.sh}/key.pem:/certs/key.pem:ro
    depends_on:
      - frontend
  frontend:
    image: nginx:alpine
    ports:
      - '127.0.0.1:18080:80'
    volumes:
      - ./rate-nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../.docker/prod/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PROXY_TEST_CERT_DIR:?run tests/proxy/run.sh}/proxy-trust.conf:/etc/nginx/menutor/proxy-trust.conf:ro
    networks:
      default:
        ipv4_address: 172.29.103.3
    depends_on:
      - backend
  backend:
    build:
      context: ../..
      dockerfile: .docker/prod/backend.dockerfile
    environment:
      FORWARDED_ALLOW_IPS: '172.29.103.3'
    volumes:
      - ./scope_app.py:/code/backend/api/main.py:ro
  client:
    image: python:3.14-slim
    command: ["python", "/test/check_chain.py"]
    volumes:
      - ./check_chain.py:/test/check_chain.py:ro
      - ${PROXY_TEST_CERT_DIR:?run tests/proxy/run.sh}/cert.pem:/cert.pem:ro
    networks:
      default:
        ipv4_address: 172.29.103.4
  host-client:
    image: python:3.14-slim
    network_mode: host
    command: ["python", "/test/check_chain.py", "host"]
    volumes:
      - ./check_chain.py:/test/check_chain.py:ro
      - ${PROXY_TEST_CERT_DIR:?run tests/proxy/run.sh}/cert.pem:/cert.pem:ro

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.103.0/24
          gateway: 172.29.103.1
          ip_range: 172.29.103.128/25
