services:

  frontend:
    build:
      dockerfile: .docker/dev/frontend.dockerfile
    image: oxyiramus/menutor:frontend-dev
    container_name: frontend
    ports:
      - '127.0.0.1:5174:5173'
    env_file:
      - .config/.env
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules

  backend:
    build:
      dockerfile: .docker/dev/backend.dockerfile
    image: oxyiramus/menutor:backend-dev
    container_name: backend
    ports:
      - '127.0.0.1:8000:8000'
    env_file:
      - .config/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/code/backend:delegated
      - ./alembic.ini:/code/alembic.ini:delegated
    healthcheck:
      test: curl -f http://localhost:8000/api/ping || exit 1
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:18.3
    container_name: postgres
    volumes:
      - ./.docker/volumes/db:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: pg_isready --dbname=$$POSTGRES_DB --host=127.0.0.1 --port=5432
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10
    env_file:
      - .config/.env
