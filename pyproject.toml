[project]
name = "menutor"
version = "0.15.3"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18",
    "bcrypt>=4.0",
    "fastapi>=0.115",
    "psycopg2-binary>=2.9",
    "PyJWT>=2.8",
    "python-dotenv>=1.2",
    "SQLAlchemy>=2.0",
    "python-multipart>=0.0.20",
    "reportlab>=4.0",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "black>=26.1",
    "httpx>=0.28",
    "isort>=8.0",
    "mypy>=1.19",
    "pylint>=4.0",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pypdf>=6,<8",
    "testcontainers[postgres]>=4,<5",
]

[tool.isort]
profile = "black"
