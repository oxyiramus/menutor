services:

  frontend:
    build:
      context: .
      dockerfile: .docker/prod/frontend.dockerfile
      tags:
        - ghcr.io/oxyiramus/menutor-frontend:$VERSION
    image: ghcr.io/oxyiramus/menutor-frontend:$VERSION
    container_name: frontend
    networks:
      default:
        ipv4_address: 172.29.103.3
    ports:
      - '127.0.0.1:8080:80'
    configs:
      - source: proxy_trust
        target: /etc/nginx/menutor/proxy-trust.conf
    env_file:
      - .config/.env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: .docker/prod/backend.dockerfile
      tags:
        - ghcr.io/oxyiramus/menutor-backend:$VERSION
    image: ghcr.io/oxyiramus/menutor-backend:$VERSION
    container_name: backend
    environment:
      FORWARDED_ALLOW_IPS: '172.29.103.3'
    env_file:
      - .config/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8000/api/ping || exit 1
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:18.3
    container_name: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: pg_isready --dbname=$$POSTGRES_DB --host=127.0.0.1 --port=5432
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10
    env_file:
      - .config/.env
    restart: unless-stopped

volumes:
  postgres_data:

configs:
  proxy_trust:
    file: .config/proxy-trust.conf

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.103.0/24
          gateway: 172.29.103.1
          ip_range: 172.29.103.128/25
