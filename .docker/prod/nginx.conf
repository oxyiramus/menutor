# Docker's gateway also represents direct host callers. Require the host proxy credential.
map_hash_bucket_size 128;
map "$realip_remote_addr:$http_x_menutor_proxy_key" $from_host_proxy {
    default 0;
    include /etc/nginx/menutor/proxy-trust.conf;
}

map "$from_host_proxy:$http_x_forwarded_proto" $external_scheme {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

map $from_host_proxy $client_address {
    default $realip_remote_addr;
    1 $remote_addr;
}

# Empty keys are ignored by limit_req.
map $uri $auth_login_key {
    default "";
    ~^/api/auth/login$ $client_address;
}

map $uri $auth_register_key {
    default "";
    ~^/api/auth/register$ $client_address;
}

limit_req_zone $auth_login_key zone=auth_login:10m rate=5r/m;
limit_req_zone $auth_register_key zone=auth_register:10m rate=5r/m;

server {
    listen 80;

    set_real_ip_from 172.29.103.1;
    real_ip_header X-Real-IP;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        client_max_body_size 2m;
        limit_req zone=auth_login burst=10 nodelay;
        limit_req zone=auth_register burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_address;
        proxy_set_header X-Forwarded-For $client_address;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Menutor-Proxy-Key "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
