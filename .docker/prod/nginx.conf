# Match the original socket peer even after the real IP module rewrites $remote_addr.
map "$realip_remote_addr:$http_x_forwarded_proto" $external_scheme {
    default $scheme;
    "172.29.103.2:https" https;
    "172.29.103.2:http" http;
}

server {
    listen 80;

    set_real_ip_from 172.29.103.2;
    real_ip_header X-Real-IP;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header Forwarded "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
