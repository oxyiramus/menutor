# Docker's gateway also represents direct host callers. Require the host proxy credential.
map_hash_bucket_size 128;
map "$realip_remote_addr:$http_x_menutor_proxy_key" $from_host_proxy {
    default 0;
    include /etc/nginx/menutor/proxy-trust.conf;
}

map "$from_host_proxy:$http_x_forwarded_proto" $external_scheme {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

map $from_host_proxy $client_address {
    default $realip_remote_addr;
    1 $remote_addr;
}

server {
    listen 80;

    set_real_ip_from 172.29.103.1;
    real_ip_header X-Real-IP;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_address;
        proxy_set_header X-Forwarded-For $client_address;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Menutor-Proxy-Key "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
